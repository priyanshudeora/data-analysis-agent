AWSTemplateFormatVersion: "2010-09-09"
Description: InsightPilot ECR and EC2 deployment behind an HTTPS Application Load Balancer

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  CertificateArn:
    Type: String
    Description: ACM certificate ARN in this stack's region for the public app hostname
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's token.actions.githubusercontent.com IAM OIDC provider
  GitHubSubject:
    Type: String
    Default: repo:priyanshudeora/data-analysis-agent:environment:production
    Description: Exact GitHub OIDC sub claim allowed to assume the deployment role
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the public HTTPS load balancer

Resources:
  ContainerRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the newest 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS access to InsightPilot
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: InsightPilot traffic from the load balancer only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullInsightPilotImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt ContainerRepository.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          GroupSet: [!Ref InstanceSecurityGroup]
          SubnetId: !Ref PublicSubnetA
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker awscli
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent
      Tags:
        - Key: Name
          Value: InsightPilot
        - Key: App
          Value: insightpilot

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8501
      Protocol: HTTP
      TargetType: instance
      Targets:
        - Id: !Ref AppInstance
          Port: 8501
      HealthCheckPath: /_stcore/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  DeployDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      Content:
        schemaVersion: "2.2"
        description: Deploy an InsightPilot image from ECR
        parameters:
          ImageUri:
            type: String
            interpolationType: ENV_VAR
            allowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*:[a-f0-9-]+$'
          AwsRegion:
            type: String
            interpolationType: ENV_VAR
            allowedPattern: '^[a-z0-9-]+$'
        mainSteps:
          - action: aws:runShellScript
            name: deployContainer
            inputs:
              timeoutSeconds: "600"
              runCommand:
                - set -euo pipefail
                - REGISTRY="${SSM_ImageUri%%/*}"
                - aws ecr get-login-password --region "$SSM_AwsRegion" | docker login --username AWS --password-stdin "$REGISTRY"
                - docker pull "$SSM_ImageUri"
                - docker rm --force insightpilot 2>/dev/null || true
                - docker run --detach --name insightpilot --restart unless-stopped --read-only --tmpfs /tmp:rw,noexec,nosuid,size=536870912 --cap-drop ALL --security-opt no-new-privileges --publish 8501:8501 --env INSIGHTPILOT_LLM_PROVIDER=openrouter "$SSM_ImageUri"
                - docker image prune --force
                - timeout 90 sh -c 'until curl --fail --silent http://127.0.0.1:8501/_stcore/health; do sleep 3; done'

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: PublishAndDeployInsightPilot
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ContainerRepository.Arn
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployDocument}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${AppInstance}
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
    Description: Point the application's DNS record at this load balancer
  EcrRepositoryName:
    Value: !Ref ContainerRepository
  Ec2InstanceId:
    Value: !Ref AppInstance
  GitHubRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  SsmDeployDocument:
    Value: !Ref DeployDocument
