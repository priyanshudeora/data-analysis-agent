name: Test and deploy to AWS

on:
  pull_request:
  push:
    branches:
      - codex/openrouter-deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insightpilot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m tests.smoke_nodes
          python -m tests.smoke_llm_nodes
      - name: Build container
        run: docker build --tag insightpilot:test .

  deploy:
    if: >-
      ${{ github.event_name != 'pull_request' &&
          vars.AWS_ROLE_ARN != '' &&
          vars.AWS_REGION != '' &&
          vars.ECR_REPOSITORY != '' &&
          vars.EC2_INSTANCE_ID != '' &&
          vars.SSM_DEPLOY_DOCUMENT != '' }}
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable release image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy image through AWS Systems Manager
        id: deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCUMENT_NAME: ${{ vars.SSM_DEPLOY_DOCUMENT }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          PARAMETERS=$(jq -cn \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            '{ImageUri:[$image],AwsRegion:[$region]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT_NAME" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_STATUS=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          exit "$WAIT_STATUS"
