services:
  insightpilot:
    build: .
    image: insightpilot:local
    environment:
      INSIGHTPILOT_LLM_PROVIDER: openrouter
    ports:
      - "8501:8501"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
